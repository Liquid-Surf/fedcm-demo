<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/solid.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--pico-muted-border-color);
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    #user_header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    #user_header span {
      color: var(--pico-muted-color);
    }

    #disconnectButton {
      margin: 0;
      padding: 0.5rem 1rem;
    }

    main {
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 2rem;
      width: 100%;
    }

    #login_page {
      text-align: center;
      padding: 4rem 2rem;
    }

    .todo-list {
      list-style: none;
      padding: 0;
    }

    .todo-list li {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--pico-muted-border-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .todo-list li:last-child {
      border-bottom: none;
    }

    .todo-list .done .todo-text {
      color: var(--pico-muted-color);
      text-decoration: line-through;
    }

    .todo-list input[type="checkbox"] {
      width: 1.2rem;
      height: 1.2rem;
      margin: 0;
      flex-shrink: 0;
      cursor: pointer;
    }

    .todo-text {
      flex: 1;
    }

    .todo-delete {
      background: none;
      border: none;
      color: var(--pico-del-color, #c62828);
      cursor: pointer;
      padding: 0.25rem 0.5rem;
      margin: 0;
      font-size: 1rem;
      opacity: 0.6;
    }

    .todo-delete:hover {
      opacity: 1;
    }

    .add-todo-form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .add-todo-form input {
      flex: 1;
      margin: 0;
    }

    .add-todo-form button {
      margin: 0;
      white-space: nowrap;
    }

    .loading {
      text-align: center;
      color: var(--pico-muted-color);
      padding: 2rem;
    }

    .error {
      color: var(--pico-del-color, #c62828);
      padding: 1rem;
      background: rgba(198, 40, 40, 0.1);
      border-radius: 0.25rem;
      margin-bottom: 1rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      color: var(--pico-muted-color);
      font-size: 0.875rem;
    }

    footer a {
      margin-left: 1rem;
    }
  </style>
  <title>Todo App</title>
  <script type="module" crossorigin src="/assets/index-8da73f39.js"></script>
  <link rel="stylesheet" href="/assets/index-5a2a379a.css">
</head>

<body>
  <header>
    <h1>Todo App</h1>
    <div id="user_header" style="visibility: hidden">
      <span>Welcome, Alice</span>
      <button id="disconnectButton">Disconnect</button>
    </div>
  </header>

  <main>
    <section id="login_page">
      <p>Sign in to access your tasks</p>
      <button id="startInruptLogin">Sign in</button>
    </section>

    <section id="logged_page" style="visibility: hidden">
      <h2>My Tasks</h2>
      <div id="error_container"></div>
      <form id="add_todo_form" class="add-todo-form">
        <input type="text" id="todo_input" placeholder="What needs to be done?" required />
        <button type="submit">Add</button>
      </form>
      <div id="loading_indicator" class="loading" style="display: none;">Loading todos...</div>
      <ul id="todo_list" class="todo-list"></ul>
    </section>
  </main>

  <footer>
    Todo App 2026 <a id="login_link">IdP Settings</a>
  </footer>

  
</body>

</html>
